[package]
name = "revs-analyze"
version = "0.2.0"
edition = "2021"
description = "Analysis tools for the RE Mercenaries VS. source port (reads the user's own .ipa)"

[dependencies]
goblin = { version = "0.8", default-features = false, features = ["mach32", "mach64", "std", "endian_fd", "archive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
cpp_demangle = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
